[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicfx-ultimate"
version = "1.0.0"
description = "Local, free and open-source system-wide audio enhancement for Linux (PipeWire-native DSP: cinema-style virtualization, EQ, dynamics)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SonicFX Ultimate contributors" }]
license = { text = "MIT" }
keywords = ["audio", "pipewire", "equalizer", "spatial", "virtual-surround", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
sonicfx = "sonicfx.app:main"
sonicfx-check = "sonicfx.diagnostics.environment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
